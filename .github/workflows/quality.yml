name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -e "apps/api[test]"
      - run: npm run check:api-drift

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [apps/api, services/forecasting]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "${{ matrix.component }}[test]"
      - run: pytest
        working-directory: ${{ matrix.component }}

  platform-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smartstock
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartstock -d smartstock"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SMARTSTOCK_TEST_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@localhost:5432/smartstock
      SMARTSTOCK_EXTERNAL_SERVICES: "1"
      SMARTSTOCK_REDIS_URL: redis://localhost:6379/15
      SMARTSTOCK_BROKER_URL: amqp://guest:guest@localhost:5672//
      SMARTSTOCK_S3_ENDPOINT_URL: http://localhost:9000
      SMARTSTOCK_S3_BUCKET: smartstock-test
      AWS_ACCESS_KEY_ID: smartstock
      AWS_SECRET_ACCESS_KEY: smartstock-development-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=smartstock \
            -e MINIO_ROOT_PASSWORD=smartstock-development-only \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - run: pip install -e "apps/api[test]"
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest -m "postgres or external"
        working-directory: apps/api
