global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: smartstock-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: smartstock-forecasting
    metrics_path: /metrics
    static_configs:
      - targets: ["forecasting:8001"]
