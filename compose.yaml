name: smartstock

services:
  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      SMARTSTOCK_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@postgres:5432/smartstock
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: ./apps/api
    environment:
      SMARTSTOCK_ENVIRONMENT: development
      SMARTSTOCK_AUTH_MODE: development
      SMARTSTOCK_INVENTORY_BACKEND: postgres
      SMARTSTOCK_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@postgres:5432/smartstock
      SMARTSTOCK_REDIS_URL: redis://redis:6379/0
      SMARTSTOCK_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      SMARTSTOCK_S3_ENDPOINT_URL: http://minio:9000
      SMARTSTOCK_S3_BUCKET: smartstock-development
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-smartstock}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-smartstock-development-only}
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker:
    build: ./apps/api
    command:
      - celery
      - --app=smartstock_api.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=imports,connectors,documents,forecasts,notifications,exports
    environment:
      SMARTSTOCK_ENVIRONMENT: development
      SMARTSTOCK_AUTH_MODE: development
      SMARTSTOCK_INVENTORY_BACKEND: postgres
      SMARTSTOCK_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@postgres:5432/smartstock
      SMARTSTOCK_REDIS_URL: redis://redis:6379/0
      SMARTSTOCK_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      SMARTSTOCK_S3_ENDPOINT_URL: http://minio:9000
      SMARTSTOCK_S3_BUCKET: smartstock-development
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-smartstock}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-smartstock-development-only}
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  forecasting:
    build: ./services/forecasting
    ports: ["8001:8001"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartstock}
      POSTGRES_USER: ${POSTGRES_USER:-smartstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartstock}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartstock}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartstock-development-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 1; done;
        mc mb --ignore-existing local/smartstock-development;
        mc anonymous set none local/smartstock-development
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartstock}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartstock-development-only}

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-development-only
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/smartstock-realm.json:/opt/keycloak/data/import/smartstock-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-development-only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    ports: ["3200:3200", "4317:4317"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
